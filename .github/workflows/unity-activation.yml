name: NIGHTWIRE Unity License Activation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  request-activation:
    name: Request Unity Personal activation file
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Generate Unity activation request
        id: activation
        uses: game-ci/unity-request-activation-file@v2
        with:
          unityVersion: 6000.3.28f1

      - name: Upload activation request
        uses: actions/upload-artifact@v4
        with:
          name: NIGHTWIRE-Unity-Activation-Request
          path: ${{ steps.activation.outputs.filePath }}
          if-no-files-found: error
          retention-days: 3
