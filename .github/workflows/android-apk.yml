name: NIGHTWIRE Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-apk:
    name: Unity Android APK build
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Unity Personal secrets are configured
        shell: bash
        run: |
          missing=0
          for name in UNITY_LICENSE UNITY_EMAIL UNITY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing repository Actions secret: ${name}"
              missing=1
            fi
          done
          exit "$missing"

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Stage NIGHTWIRE runtime assemblies
        run: bash tools/prepare-unity-runtime.sh

      - name: Cache Unity project Library
        uses: actions/cache@v4
        with:
          path: unity/Library
          key: nightwire-unity-6000.3.28f1-android-${{ hashFiles('unity/Assets/**', 'unity/Packages/**', 'unity/ProjectSettings/**') }}
          restore-keys: |
            nightwire-unity-6000.3.28f1-android-

      - name: Build NIGHTWIRE Android APK
        uses: game-ci/unity-builder@v4
        with:
          projectPath: unity
          unityVersion: 6000.3.28f1
          targetPlatform: Android
          androidExportType: androidPackage
          allowDirtyBuild: true
          buildName: NIGHTWIRE
          buildsPath: build

      - name: Upload NIGHTWIRE APK
        uses: actions/upload-artifact@v4
        with:
          name: nightwire-android-apk
          path: build/Android/**/*.apk
          if-no-files-found: error
          retention-days: 14
