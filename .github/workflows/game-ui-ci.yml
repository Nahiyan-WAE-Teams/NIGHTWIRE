name: NIGHTWIRE Game UI CI

on:
  push:
    branches: [main]
    paths:
      - "unity/**"
      - "tools/prepare-unity-runtime.sh"
      - "tools/Prepare-UnityRuntime.ps1"
      - "tools/validate_unity_ui.py"
      - "tools/validate_android_aar.py"
      - "tests/test_unity_ui.py"
      - ".github/workflows/game-ui-ci.yml"
  pull_request:
    paths:
      - "unity/**"
      - "tools/prepare-unity-runtime.sh"
      - "tools/Prepare-UnityRuntime.ps1"
      - "tools/validate_unity_ui.py"
      - "tests/test_unity_ui.py"
      - ".github/workflows/game-ui-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightwire-game-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui-source-validation:
    name: Unity UI source and runtime integration checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Stage portable runtime assemblies for Unity
        run: bash tools/prepare-unity-runtime.sh

      - name: Validate Unity project and UI source contracts
        run: python tools/validate_unity_ui.py --require-staged-runtime

      - name: Run game UI source regression tests
        run: python -m unittest discover -s tests -p "test_unity_ui.py" -v

  android-platform-bridge:
    name: Android StrongBox bridge AAR
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Build StrongBox secure-store AAR
        run: gradle -p unity/Android/NightwireSecureStore --no-daemon assembleRelease

      - name: Validate AAR classes and backup exclusions
        run: python3 tools/validate_android_aar.py unity/Android/NightwireSecureStore/build/outputs/aar/NightwireSecureStore-release.aar

      - name: Upload Android secure-store AAR
        uses: actions/upload-artifact@v4
        with:
          name: nightwire-android-secure-store-aar
          path: unity/Android/NightwireSecureStore/build/outputs/aar/NightwireSecureStore-release.aar
          if-no-files-found: error
